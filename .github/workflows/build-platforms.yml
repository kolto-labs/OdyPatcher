name: Build platform binaries

on:
  workflow_dispatch:
  push:
    branches: [codex/build-platform-binaries]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-arm64:
    name: macOS ARM64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-default-features --all-targets
      - run: cargo build --release
      - run: tar -C target/release -czf odypatcher-macos-arm64.tar.gz odypatcher
      - uses: actions/upload-artifact@v4
        with:
          name: odypatcher-macos-arm64
          path: odypatcher-macos-arm64.tar.gz

  other-platforms:
    name: ${{ matrix.name }}
    needs: macos-arm64
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x86_64
            os: macos-15-intel
            archive: odypatcher-macos-x86_64.tar.gz
            binary: odypatcher
          - name: Linux x86_64
            os: ubuntu-24.04
            archive: odypatcher-linux-x86_64.tar.gz
            binary: odypatcher
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            archive: odypatcher-linux-arm64.tar.gz
            binary: odypatcher
          - name: Windows x86_64
            os: windows-2025
            archive: odypatcher-windows-x86_64.tar.gz
            binary: odypatcher.exe
          - name: Windows ARM64
            os: windows-11-arm
            archive: odypatcher-windows-arm64.tar.gz
            binary: odypatcher.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev
      - run: cargo test --no-default-features --all-targets
      - run: cargo build --release
      - shell: bash
        run: tar -C target/release -czf "${{ matrix.archive }}" "${{ matrix.binary }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  windows-x86:
    name: Windows x86
    needs: macos-arm64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-default-features --all-targets --target i686-pc-windows-msvc
      - run: cargo build --release --target i686-pc-windows-msvc
      - shell: bash
        run: tar -C target/i686-pc-windows-msvc/release -czf odypatcher-windows-x86.tar.gz odypatcher.exe
      - uses: actions/upload-artifact@v4
        with:
          name: odypatcher-windows-x86.tar.gz
          path: odypatcher-windows-x86.tar.gz
