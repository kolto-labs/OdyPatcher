name: Build platform binaries

# Runs by hand, and as a step of the release workflow, which passes the release
# tag as `ref` so the binaries come from exactly the tagged commit.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build. Empty builds the selected ref.
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or commit to build.
        type: string
        required: false
        default: ""
    secrets:
      CARGO_PAT:
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-arm64:
    name: macOS ARM64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # bionsscomp lives in a private repo; CARGO_PAT lets Cargo clone it.
      - name: Configure git for private deps
        run: git config --global url."https://${{ secrets.CARGO_PAT }}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-default-features --all-targets
      - run: cargo build --release
      - name: Package
        run: |
          cp LICENSE README.md target/release/
          tar -C target/release -czf odypatcher-macos-arm64.tar.gz odypatcher LICENSE README.md
      - uses: actions/upload-artifact@v4
        with:
          name: odypatcher-macos-arm64
          path: odypatcher-macos-arm64.tar.gz
          if-no-files-found: error

  other-platforms:
    name: ${{ matrix.name }}
    needs: macos-arm64
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x86_64
            os: macos-15-intel
            archive: odypatcher-macos-x86_64.tar.gz
            binary: odypatcher
          - name: Linux x86_64
            os: ubuntu-24.04
            archive: odypatcher-linux-x86_64.tar.gz
            binary: odypatcher
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            archive: odypatcher-linux-arm64.tar.gz
            binary: odypatcher
          - name: Windows x86_64
            os: windows-2025
            archive: odypatcher-windows-x86_64.tar.gz
            binary: odypatcher.exe
          - name: Windows ARM64
            os: windows-11-arm
            archive: odypatcher-windows-arm64.tar.gz
            binary: odypatcher.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Configure git for private deps
        run: git config --global url."https://${{ secrets.CARGO_PAT }}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev
      - run: cargo test --no-default-features --all-targets
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          cp LICENSE README.md target/release/
          tar -C target/release -czf "${{ matrix.archive }}" "${{ matrix.binary }}" LICENSE README.md
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  windows-7:
    name: Windows 7 x86 (terminal)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Configure git for private deps
        run: git config --global url."https://${{ secrets.CARGO_PAT }}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@1.77.2
        with:
          targets: i686-pc-windows-msvc

      - run: cargo build --release --no-default-features --target i686-pc-windows-msvc
      - name: Package
        shell: bash
        run: |
          cp LICENSE README.md target/i686-pc-windows-msvc/release/
          tar -C target/i686-pc-windows-msvc/release -czf odypatcher-windows7-x86.tar.gz odypatcher.exe LICENSE README.md
      - uses: actions/upload-artifact@v4
        with:
          name: odypatcher-windows7-x86.tar.gz
          path: odypatcher-windows7-x86.tar.gz
          if-no-files-found: error
